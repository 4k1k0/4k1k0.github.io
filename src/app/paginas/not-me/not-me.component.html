<h2>Info</h2>

<table id="tabla">
  <tbody>
    @for (spec of specs; track spec.nombre) {
      <tr class="fila">
        <th scope="row" class="columna">{{ spec.nombre }}</th>
        <td class="columna">
          @if (spec.url) {
            <a [href]="spec.url" target="_blank" rel="noopener">
              {{ spec.descripcion }}
            </a>
          } @else {
            {{ spec.descripcion }}
          }
        </td>
      </tr>
    }
  </tbody>
</table>
